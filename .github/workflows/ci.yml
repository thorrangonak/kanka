name: CI

# Her push ve PR'da build kontrolü yapar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} kur
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Build
        run: npm run build

      - name: CLI çalışıyor mu test et
        run: |
          node dist/cli.js --versiyon
          node dist/cli.js --yardım | head -10
